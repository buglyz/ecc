name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Security Scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          go build -ldflags="-s -w -H windowsgui" -o ecc.exe ./cmd/fan-controller/

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw '未找到 ISCC.exe' }
          $root = (Get-Location).Path
          $dist = Join-Path $root 'dist'
          & $iscc '/DAppVersion=dev' "/DSourceRoot=$root" "/O$dist" 'installer\ecc.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 编译失败' }

      - name: Package Portable
        run: |
          New-Item -ItemType Directory -Force -Path portable
          Copy-Item -Path ecc.exe -Destination portable/
          Copy-Item -Path assets -Destination portable/ -Recurse
          Copy-Item -Path install.ps1 -Destination portable/
          Copy-Item -Path uninstall.ps1 -Destination portable/
          Copy-Item -Path README.md -Destination portable/
          Compress-Archive -Path portable/* -DestinationPath ecc-dev-windows-amd64.zip -Force

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          name: ecc-installer-windows-amd64
          path: dist/ECC-Setup-dev.exe

      - name: Upload Portable
        uses: actions/upload-artifact@v7
        with:
          name: ecc-portable-windows-amd64
          path: ecc-dev-windows-amd64.zip
