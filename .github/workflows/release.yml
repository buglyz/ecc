name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          go build -ldflags="-s -w -H windowsgui" -o ecc.exe ./cmd/fan-controller/

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        run: |
          $version = "${{ github.event.inputs.tag }}"
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw '未找到 ISCC.exe' }
          $root = (Get-Location).Path
          $dist = Join-Path $root 'dist'
          & $iscc "/DAppVersion=$version" "/DSourceRoot=$root" "/O$dist" 'installer\ecc.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 编译失败' }

      - name: Package Release
        run: |
          $version = "${{ github.event.inputs.tag }}"
          $zipName = "ecc-$version-windows-amd64.zip"
          $setupName = "ECC-Setup-$version.exe"
          if (-not (Test-Path -Path "dist\$setupName")) {
            throw "安装包未生成: dist\$setupName"
          }

          New-Item -ItemType Directory -Force -Path release
          Copy-Item -Path ecc.exe -Destination release/
          Copy-Item -Path assets -Destination release/ -Recurse
          Copy-Item -Path install.ps1 -Destination release/
          Copy-Item -Path uninstall.ps1 -Destination release/
          Copy-Item -Path README.md -Destination release/

          # 创建版本信息文件
          @"
          ECC Fan Controller $version
          Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          Commit: ${{ github.sha }}
          "@ | Out-File -FilePath release/VERSION.txt -Encoding utf8

          # 打包
          Compress-Archive -Path release/* -DestinationPath $zipName

          # 生成 SHA256 校验和
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          $setupHash = (Get-FileHash -Path "dist\$setupName" -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          "$setupHash  $setupName" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8 -Append

          Write-Host "Package: $zipName"
          Write-Host "SHA256: $hash"
          Write-Host "Installer: $setupName"
          Write-Host "SHA256: $setupHash"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.tag }}
          files: |
            dist/ECC-Setup-${{ github.event.inputs.tag }}.exe
            ecc-${{ github.event.inputs.tag }}-windows-amd64.zip
            SHA256SUMS.txt
          body: |
            ## ECC Fan Controller ${{ github.event.inputs.tag }}

            ### 方式一：安装包（推荐）
            1. 下载 `ECC-Setup-${{ github.event.inputs.tag }}.exe`
            2. 双击运行，按向导完成安装（会自动请求管理员权限）
            3. 安装完成后从桌面或开始菜单启动

            ### 方式二：便携版 ZIP
            1. 下载 `ecc-${{ github.event.inputs.tag }}-windows-amd64.zip` 并解压
            2. 右键 `install.ps1` → 以管理员身份运行 PowerShell
            3. 按提示完成安装

            ### 使用说明
            - 双击桌面快捷方式启动程序
            - 浏览器自动打开控制面板 (http://localhost:8765)
            - 在控制面板中设置开机自启、调整风扇曲线

            ### 卸载
            - 安装包版本：Windows「设置 → 应用 → 已安装的应用」中卸载 ECC Fan Controller
            - 便携版：运行 `uninstall.ps1`

            ### 校验文件完整性
            ```powershell
            # 安装包
            (Get-FileHash ECC-Setup-${{ github.event.inputs.tag }}.exe).Hash
            # 便携版
            (Get-FileHash ecc-${{ github.event.inputs.tag }}-windows-amd64.zip).Hash
            # 对比 SHA256SUMS.txt 中的值
            ```

            ### 更新日志
            查看 [提交历史](https://github.com/${{ github.repository }}/commits/${{ github.event.inputs.tag }}) 了解详细变更。
